[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osap-videos"
version = "0.2.4"
description = "Aplicativo de búsqueda y votación de vídeos de YouTube para OSAP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "jinja2>=3.1,<4",
  "pymysql>=1.1,<2",
  "httpx>=0.27,<1",
  "pyyaml>=6,<7",
  "python-multipart>=0.0.9,<1",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools]
py-modules = ["app"]
